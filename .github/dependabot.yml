version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Shared library changes also need matching runtime/lockfile metadata.
    # The central rollout coordinator owns these updates.
    ignore:
      - dependency-name: "budget-buddy-org/budget-buddy-workflows*"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
