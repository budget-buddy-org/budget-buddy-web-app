name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run-release:
        description: Preview release using the default branch
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  commitlint:
    uses: budget-buddy-org/ci-workflows/.github/workflows/commitlint.yml@1736e615609d211e1cdbe74314e4199faed158b6

  ci:
    needs: commitlint
    uses: budget-buddy-org/ci-workflows/.github/workflows/web-ci.yml@1736e615609d211e1cdbe74314e4199faed158b6

  release:
    needs: [ci, commitlint]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry-run-release)
    uses: budget-buddy-org/ci-workflows/.github/workflows/release.yml@1736e615609d211e1cdbe74314e4199faed158b6
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      RELEASE_BOT_ID: ${{ secrets.RELEASE_BOT_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
