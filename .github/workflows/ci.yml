name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run-release:
        description: Preview release from this ref
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  commitlint:
    uses: budget-buddy-org/ci-workflows/.github/workflows/commitlint.yml@235bd4425fe8005786d300dee35a35bd2ba90b96

  ci:
    needs: commitlint
    uses: budget-buddy-org/ci-workflows/.github/workflows/web-ci.yml@235bd4425fe8005786d300dee35a35bd2ba90b96

  release:
    needs: [ci, commitlint]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry-run-release)
    uses: budget-buddy-org/ci-workflows/.github/workflows/release.yml@235bd4425fe8005786d300dee35a35bd2ba90b96
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      RELEASE_BOT_ID: ${{ secrets.RELEASE_BOT_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
