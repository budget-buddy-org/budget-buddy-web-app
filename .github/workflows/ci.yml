name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run-release:
        description: Preview release from this ref
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  commitlint:
    uses: budget-buddy-org/ci-workflows/.github/workflows/pr-title.yml@24c274c00d122d32765bf3248ed84fe824274912

  ci:
    uses: budget-buddy-org/ci-workflows/.github/workflows/web-ci.yml@24c274c00d122d32765bf3248ed84fe824274912

  release:
    needs: ci
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry-run-release)
    uses: budget-buddy-org/ci-workflows/.github/workflows/release.yml@24c274c00d122d32765bf3248ed84fe824274912
    with:
      profile: web-app
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      RELEASE_BOT_ID: ${{ secrets.RELEASE_BOT_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
