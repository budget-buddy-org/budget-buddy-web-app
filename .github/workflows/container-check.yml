name: Container checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'nginx*'
      - 'src/**'
      - 'public/**'
      - 'vite.config.*'
      - 'tsconfig*'
      - '.npmrc'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  image:
    uses: budget-buddy-org/ci-workflows/.github/workflows/web-image-check.yml@f7140d62236354f8698c220180658c573fa2b6ec
